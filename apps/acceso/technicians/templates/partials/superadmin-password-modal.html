<div
  class="modal fade"
  id="superadmin-password-modal"
  tabindex="-1"
  aria-labelledby="superadmin-password-title"
  aria-hidden="true"
  data-has-errors="{% if form.admin_password.errors %}true{% else %}false{% endif %}"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5
          class="modal-title"
          id="superadmin-password-title"
        >
          Confirmar superadministrador
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Cerrar"
        ></button>
      </div>

      <div class="modal-body">
        <div class="alert alert-warning">
          <div class="d-flex gap-3">
            <i class="ri-shield-keyhole-line ri-22px"></i>

            <div>
              <h6 class="alert-heading mb-1">
                Esta operación entrega acceso completo
              </h6>

              <p class="mb-0">
                Confirma tu contraseña actual para continuar.
              </p>
            </div>
          </div>
        </div>

        <div class="form-password-toggle">
          <div class="input-group input-group-merge">
            <div class="form-floating form-floating-outline">
              <input
                type="password"
                name="{{ form.admin_password.html_name }}"
                id="{{ form.admin_password.id_for_label }}"
                form="technician-form"
                class="form-control{% if form.admin_password.errors %} is-invalid{% endif %}"
                placeholder="Contraseña actual"
                autocomplete="current-password"
              >

              <label for="{{ form.admin_password.id_for_label }}">
                Tu contraseña actual
              </label>
            </div>

            <span class="input-group-text cursor-pointer">
              <i class="ri-eye-off-line ri-20px"></i>
            </span>
          </div>

          <div
            id="admin-password-client-error"
            class="invalid-feedback d-none"
          >
            Debes ingresar tu contraseña.
          </div>

          {% for error in form.admin_password.errors %}
            <div class="invalid-feedback d-block">
              {{ error }}
            </div>
          {% endfor %}
        </div>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-outline-secondary"
          data-bs-dismiss="modal"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="btn btn-primary"
          id="confirm-superadmin-password"
        >
          <i class="ri-shield-check-line me-1"></i>
          Confirmar y guardar
        </button>
      </div>

    </div>
  </div>
</div>
